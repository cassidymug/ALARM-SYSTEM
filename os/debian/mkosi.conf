# mkosi configuration for Guardian Debian appliance image
# https://github.com/systemd/mkosi

[Output]
ImageId=guardian-appliance
ImageVersion=0.1.0
Output=guardian-appliance

[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86-64

[Content]
Packages=
    systemd
    systemd-resolved
    systemd-timesyncd
    dbus
    ca-certificates
    openssh-server
    ffmpeg
    network-manager

# System setup
Bootable=yes
WithDocs=no
WithTests=no

# Minimal system
CleanPackageMetadata=yes

[Host]
# SSH access for setup/debugging
Ssh=yes
