# mkosi configuration for Guardian Debian appliance image
# https://github.com/systemd/mkosi

[Output]
ImageId=guardian-appliance
ImageVersion=0.1.0
Output=guardian-appliance
Format=disk

[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86-64
Mirror=https://deb.debian.org/debian

[Content]
Packages=
    systemd
    systemd-resolved
    systemd-timesyncd
    dbus
    ca-certificates
    openssh-server
    ffmpeg
    network-manager
    curl
    vim-tiny
    htop
    iptables
    nftables

# System setup
Bootable=yes
WithDocs=no
WithTests=no

# Minimal system
CleanPackageMetadata=yes
RemoveFiles=
    /var/cache/apt/archives/*
    /var/lib/apt/lists/*
    /usr/share/doc/*
    /usr/share/man/*

[Host]
# SSH access for setup/debugging
Ssh=yes
QemuHeadless=no

[Validation]
SecureBoot=no
SignExpectedPcr=no
